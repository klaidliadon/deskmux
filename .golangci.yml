version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - unparam
    - nakedret
    - prealloc

  settings:
    govet:
      enable-all: true
      disable:
        # This codebase calls Win32 and COM by hand. Converting uintptr to
        # unsafe.Pointer is unavoidable when dispatching through a COM vtable
        # or reading a KBDLLHOOKSTRUCT out of an LPARAM. The pointers involved
        # reference OS-owned native memory that Go's garbage collector neither
        # moves nor reclaims, so the pattern is sound here even though the
        # check cannot prove it.
        - unsafeptr
        - fieldalignment

    revive:
      rules:
        - name: exported
        - name: indent-error-flow
        - name: var-naming
          arguments:
            - []
            - []
            # Package-level identifiers are prefixed with _ per the Uber Go
            # style guide, which var-naming would otherwise flag.
            - - upperCaseConst: true

    errcheck:
      # These do not report failure through their error return.
      #
      # LazyProc.Call and SyscallN always hand back the thread's last Win32
      # error, set or not, so it is meaningless unless the primary return
      # value already indicated failure. Checking it would be actively wrong:
      # a successful call routinely returns a stale non-nil error. Every site
      # that can fail meaningfully inspects the primary return instead.
      exclude-functions:
        - (*syscall.LazyProc).Call
        - syscall.SyscallN

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/klaidliadon/deskmux
