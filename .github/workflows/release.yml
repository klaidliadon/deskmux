name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Windows, not ubuntu: the module imports dxva2, NVAPI and Core Audio, so
    # it does not compile anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser builds its changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before publishing
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

