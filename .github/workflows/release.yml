name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # Windows, not ubuntu: the module imports dxva2, NVAPI and Core Audio, so
    # it does not compile anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds its changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before publishing
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushing the scoop manifest goes to a different repository, which
          # GITHUB_TOKEN has no rights to. Create this secret before tagging,
          # or the release will fail at the scoop step with the artifacts
          # already published.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
