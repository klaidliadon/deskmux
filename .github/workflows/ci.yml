name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The module is Windows-only, so there is no cross-platform matrix to run.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        # unsafeptr is off: COM vtable dispatch and Win32 hook callbacks have
        # to convert uintptr to unsafe.Pointer, and those reference OS-owned
        # memory the collector never manages.
        run: go vet -unsafeptr=false ./...

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "gofmt needed on:`n$unformatted"
            exit 1
          }

  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Run the linter the same way the Makefile does, rather than through
      # the action. golangci-lint-action@v6 installs the latest v1, which is
      # built against go1.24 and refuses a go.mod targeting 1.25 -- and this
      # repository's .golangci.yml is v2 schema, which v1 cannot parse at all.
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run
